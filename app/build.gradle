plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.lumalabs.slate'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.lumalabs.slate'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('LUMA_ANDROID_KEYSTORE_PATH')
            def storePasswordEnv = System.getenv('LUMA_ANDROID_KEYSTORE_PASSWORD')
            def keyAliasEnv = System.getenv('LUMA_ANDROID_KEY_ALIAS')
            def keyPasswordEnv = System.getenv('LUMA_ANDROID_KEY_PASSWORD')

            if (storeFilePath && storePasswordEnv && keyAliasEnv && keyPasswordEnv) {
                storeFile file(storeFilePath)
                storePassword storePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/lumaAssets"
        }
    }
}

def webFiles = [
    'index.html',
    'styles.css',
    'app.js',
    'features-v010.js',
    'manifest.webmanifest',
    'update-manifest.json'
]

tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir) {
        include webFiles
    }
    into(layout.buildDirectory.dir('generated/lumaAssets'))
}

preBuild.dependsOn syncWebAssets

tasks.register('verifyReleaseSigning') {
    doLast {
        def required = [
            'LUMA_ANDROID_KEYSTORE_PATH',
            'LUMA_ANDROID_KEYSTORE_PASSWORD',
            'LUMA_ANDROID_KEY_ALIAS',
            'LUMA_ANDROID_KEY_PASSWORD'
        ]
        def missing = required.findAll { !System.getenv(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is mandatory. Missing environment variables: ${missing.join(', ')}")
        }
        def keystore = file(System.getenv('LUMA_ANDROID_KEYSTORE_PATH'))
        if (!keystore.exists()) {
            throw new GradleException("Release signing keystore not found at ${keystore}")
        }
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        dependsOn tasks.named('verifyReleaseSigning')
    }
}
