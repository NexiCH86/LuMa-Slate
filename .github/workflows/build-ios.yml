name: Build iPadOS

on:
  push:
    branches: [main, feature/ipados-shell]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipados:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify committed BOG Note app icon
        run: test -f ios/LuMaSlate/Assets.xcassets/AppIcon.appiconset/LuMaSlateIcon.png

      - name: Build BOG Note for iPad Simulator
        run: |
          xcodebuild \
            -project ios/LuMaSlate.xcodeproj \
            -scheme LuMaSlate \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build unsigned iPadOS device app
        run: |
          xcodebuild \
            -project ios/LuMaSlate.xcodeproj \
            -scheme LuMaSlate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/ipados" \
            build

      - name: Package unsigned app and IPA
        run: |
          set -e
          mkdir -p build/package/Payload
          cp -R "build/ipados/BOG Note.app" "build/package/Payload/BOG Note.app"
          (cd build/package && zip -qry ../BOG-Note-iPadOS-unsigned.ipa Payload)
          (cd build/ipados && zip -qry ../BOG-Note-iPadOS-unsigned-app.zip "BOG Note.app")
          shasum -a 256 build/BOG-Note-iPadOS-unsigned.ipa > build/BOG-Note-iPadOS-unsigned.ipa.sha256
          ls -lh build/BOG-Note-iPadOS-unsigned.ipa build/BOG-Note-iPadOS-unsigned-app.zip

      - name: Upload iPadOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: BOG-Note-iPadOS-IPA
          path: |
            build/BOG-Note-iPadOS-unsigned.ipa
            build/BOG-Note-iPadOS-unsigned.ipa.sha256
          retention-days: 30

      - name: Upload iPadOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: BOG-Note-iPadOS-App
          path: build/BOG-Note-iPadOS-unsigned-app.zip
          retention-days: 30
