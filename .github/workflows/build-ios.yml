name: Build iPadOS

on:
  push:
    branches: [main, feature/ipados-shell]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipados:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate LuMa Slate app icon
        run: |
          SDKROOT="" xcrun --sdk macosx swift \
            ios/LuMaSlate/GenerateAppIcon.swift \
            ios/LuMaSlate/Assets.xcassets/AppIcon.appiconset/LuMaSlateIcon.png
          test -f ios/LuMaSlate/Assets.xcassets/AppIcon.appiconset/LuMaSlateIcon.png

      - name: Build LuMa Slate for iPad Simulator
        run: |
          xcodebuild \
            -project ios/LuMaSlate.xcodeproj \
            -scheme LuMaSlate \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build unsigned iPadOS device app
        run: |
          xcodebuild \
            -project ios/LuMaSlate.xcodeproj \
            -scheme LuMaSlate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/ipados" \
            build

      - name: Package unsigned app and IPA
        run: |
          set -e
          mkdir -p build/package/Payload
          cp -R "build/ipados/LuMa Slate.app" "build/package/Payload/LuMa Slate.app"
          (cd build/package && zip -qry ../LuMa-Slate-iPadOS-unsigned.ipa Payload)
          (cd build/ipados && zip -qry ../LuMa-Slate-iPadOS-unsigned-app.zip "LuMa Slate.app")
          shasum -a 256 build/LuMa-Slate-iPadOS-unsigned.ipa > build/LuMa-Slate-iPadOS-unsigned.ipa.sha256
          ls -lh build/LuMa-Slate-iPadOS-unsigned.ipa build/LuMa-Slate-iPadOS-unsigned-app.zip

      - name: Upload iPadOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuMa-Slate-iPadOS-IPA
          path: |
            build/LuMa-Slate-iPadOS-unsigned.ipa
            build/LuMa-Slate-iPadOS-unsigned.ipa.sha256
          retention-days: 30

      - name: Upload iPadOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: LuMa-Slate-iPadOS-App
          path: build/LuMa-Slate-iPadOS-unsigned-app.zip
          retention-days: 30
