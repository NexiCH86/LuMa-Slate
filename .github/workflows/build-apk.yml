name: Build LuMa Slate APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'update-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk LuMa-Slate-Shell-1.0.1-alpha1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuMa-Slate-Shell-1.0.1-alpha1
          path: LuMa-Slate-Shell-1.0.1-alpha1.apk
          retention-days: 30
