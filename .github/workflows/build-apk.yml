name: Build LuMa Slate Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'features-v010.js'
      - 'manifest.webmanifest'
      - 'update-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore private release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMA_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Required secret LUMA_ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luma-slate-release.jks"
          chmod 600 "$RUNNER_TEMP/luma-slate-release.jks"

      - name: Build release-signed APK
        env:
          LUMA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/luma-slate-release.jks
          LUMA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LUMA_ANDROID_KEYSTORE_PASSWORD }}
          LUMA_ANDROID_KEY_ALIAS: ${{ secrets.LUMA_ANDROID_KEY_ALIAS }}
          LUMA_ANDROID_KEY_PASSWORD: ${{ secrets.LUMA_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" LuMa-Slate-Shell-1.1.1-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LuMa-Slate-Shell-1.1.1-release
          path: LuMa-Slate-Shell-1.1.1-release.apk
          retention-days: 90
