name: Notes 0.12.8 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.8 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0128-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.8 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.8",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:05:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Text blocks can now be freely resized in Text mode from small labels up to almost the full note page",
              "Text automatically wraps inside the selected block",
              "The chosen block width and height are persisted with the note and survive tool changes and reloads",
              "Existing positioned text, Pen and Marker layering, state synchronization and deletion confirmations are retained",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.8 resizable text blocks' || exit 0
          git push
