name: Notes 0.12.43 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Notes 0.12.43 corrected upward alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<!-- NOTES-PRO-0\.12\.42 -->\s*<script>.*?</script>','',s,flags=re.S)
          j=Path('notes-01243-header-correct-up.js').read_text()
          marker='<!-- NOTES-PRO-0.12.43 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.43","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:53:00+02:00","mandatory":false,"releaseNotes":["Corrects the previous movement direction","Removes the 0.12.42 downward adjustment","Moves the status pills upward relative to the better 0.12.41 position: bottom 18px to bottom 30px","Keeps size, horizontal position and Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.43 corrected upward alignment' || exit 0
          git push
