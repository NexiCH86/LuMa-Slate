name: Notes 0.12.15 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.15 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01215-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.15 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.15",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:32:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Legacy text formatting popups are now permanently suppressed in Text mode to stop the brief flash seen on BOOX",
              "The stable text options row now includes the missing text colors plus alignment, presets, list, checklist and highlight controls",
              "Manual resize now uses a document-level pointer/touch drag implementation with a larger BOOX-safe handle",
              "Automatic text block growth again expands to the right first and then downward when wrapping is required",
              "Width and height are persisted after manual resize, automatic growth and before tool switches",
              "Textblock löschen keeps the LuMa confirmation dialog with Abbrechen and Löschen",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.15 consolidated text controls and resize' || exit 0
          git push
