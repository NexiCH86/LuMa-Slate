name: Notes 0.12.22 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.22 UI cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01222-ui-cleanup.js').read_text()
          marker='<!-- NOTES-PRO-0.12.22 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.22","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T13:16:00+02:00","mandatory":false,"releaseNotes":["Removes the remaining redundant Text and Radierer summary pills in addition to Pen/Marker summaries","Strengthens BOOX fullscreen cleanup so normal Speichern, Mit LuMa AI öffnen and Notes Pro chrome are hidden","Keeps only the compact top-right fullscreen tool indicator and X control","Keeps the hardware-confirmed Notes writing, mixed colors, resize and autosave logic unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.22 UI cleanup' || exit 0
          git push
