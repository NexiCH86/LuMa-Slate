name: Notes 0.12.25 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.25 fullscreen HUD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01225-fullscreen-hud.js').read_text()
          marker='<!-- NOTES-PRO-0.12.25 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.25","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:05:00+02:00","mandatory":false,"releaseNotes":["Adds a dedicated fullscreen HUD independent of the legacy Notes DOM so BOOX always shows the active tool and X exit control","The X directly removes the real body np122-full fullscreen class","Preserves the clean full-page canvas from 0.12.24","No changes to writing, colors, resize, pen, marker, eraser or autosave","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.25 dedicated fullscreen HUD' || exit 0
          git push
