name: Notes 0.12.19 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline focused Notes 0.12.19 color fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          j=Path('notes-01219-colorfix.js').read_text()
          marker='<!-- NOTES-PRO-0.12.19 -->'
          if marker not in s:
              s=s.replace('</body>', marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.19",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T13:08:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Keeps the hardware-confirmed Notes 0.12.18 writing, resize, geometry persistence and overflow-only growth unchanged",
              "Fixes insertion color being reset to black as soon as typing resumes",
              "The selected text color is now kept independently for the active text block and re-applied to newly inserted characters after every native BOOX input event",
              "Existing characters keep their original colors while new characters use the currently selected color",
              "Selecting a text range and choosing a color continues to affect only that selection",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.19 insertion color persistence' || exit 0
          git push
