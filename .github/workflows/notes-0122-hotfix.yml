name: Notes 0.12.5 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.5 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0125-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.5 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.5",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T11:28:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Repairs Text mode so tapping an empty point on the note page creates and focuses a positioned text block",
              "Keeps handwriting and marker ink above typed text in Pen and Marker modes",
              "Replaces browser confirmation dialogs with LuMa Slate in-app confirmation dialogs for Ink löschen and Notiz löschen",
              "Ink löschen clears only handwriting and marker strokes on the current page after confirmation",
              "Notiz löschen removes the complete note only after explicit confirmation",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.5' || exit 0
          git push
