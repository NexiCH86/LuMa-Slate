name: Notes 0.12.35 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.35 exact baseline alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01235-header-baseline.js').read_text()
          marker='<!-- NOTES-PRO-0.12.35 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.35","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:14:00+02:00","mandatory":false,"releaseNotes":["Vertically adjusts the three Notes status pills so their bottom edge matches the actual bottom edge of the Notes title","Keeps horizontal centering, pill sizes and the HANDWRITTEN & DIGITAL / Notes layout unchanged","Uses the rendered Notes title position for exact alignment on the BOOX layout","Keeps all confirmed Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.35 exact header baseline' || exit 0
          git push
