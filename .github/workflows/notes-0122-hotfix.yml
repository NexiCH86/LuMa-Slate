name: Notes 0.12.2 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0122-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.2 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.2",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T10:52:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Notes Pro 0.12.2 combines positioned text blocks and handwriting on the same page",
              "Text mode lets you tap a position and type there while existing ink remains visible",
              "Added Fineliner, ballpoint, pencil, fountain pen, brush pen and felt-tip styles",
              "Expanded Kaleido-friendly pen colors and added independent marker colors",
              "Added fullscreen Notes writing mode with compact active-tool status",
              "Projects can be created directly from Notes and stored in the shared project registry",
              "Existing Notes v2 data is retained; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.2' || exit 0
          git push
