name: Notes 0.12.11 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.11 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01211-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.11 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.11",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:02:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Text blocks keep their readable content height when switching from Text to Pen, Marker or Eraser",
              "A dedicated persistent Aa Textoptionen button replaces the unreliable flashing BOOX popup path",
              "Empty text blocks are automatically removed when leaving Text mode or after an empty block loses focus",
              "The text options panel also includes an explicit Textblock löschen action for manual cleanup",
              "Automatic text growth continues horizontally to the right and then vertically after wrapping",
              "Text content, formatting, size and position remain persisted",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.11 text stability' || exit 0
          git push
