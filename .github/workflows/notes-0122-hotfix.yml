name: Notes 0.12.41 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Notes 0.12.41 photo-corrected alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01241-header-photo-fix.js').read_text()
          marker='<!-- NOTES-PRO-0.12.41 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.41","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:44:00+02:00","mandatory":false,"releaseNotes":["Corrects the vertical direction after reviewing the real BOOX photo","Moves the three status pills downward by 60 CSS pixels relative to 0.12.40 so their lower border aligns with the visible bottom of the Notes lettering","Keeps pill size and horizontal position unchanged","Keeps all confirmed Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.41 photo-corrected alignment' || exit 0
          git push
