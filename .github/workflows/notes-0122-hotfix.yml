name: Notes 0.12.3 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.3 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0123-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.3 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.3",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T11:05:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Notes Pro now shows only settings relevant to the selected tool",
              "Pen mode shows pen style, thickness and pen colors only",
              "Marker mode shows marker colors, width and opacity only",
              "Text mode adds font family, font size, text color, bold, italic, underline and alignment",
              "Added text presets for Title, Body and Quote plus bullet list, checklist and highlight background helpers",
              "Text formatting is stored per positioned text block so mixed handwriting and formatted text remain on the same page",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.3' || exit 0
          git push
