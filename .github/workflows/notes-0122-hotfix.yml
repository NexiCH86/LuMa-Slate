name: Notes 0.12.6 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.6 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0126-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.6 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.6",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T11:36:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Removes the temporary 'Hier tippen' helper box from Notes Text mode",
              "Text blocks can now be placed anywhere on the page by tapping a free position",
              "Text fields are created directly in the trusted pointer gesture and focused immediately for improved BOOX keyboard activation",
              "Legacy delayed text placement is suppressed to prevent the text field from flashing and disappearing",
              "Existing Pen, Marker, formatting and deletion confirmation behavior is retained",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.6' || exit 0
          git push
