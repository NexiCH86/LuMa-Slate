name: Notes 0.12.16 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.16 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01216-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.16 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.16",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:45:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Text blocks now use a rich-text editing overlay while keeping the existing Notes data model and BOOX-safe base renderer underneath",
              "Text colors are now cursor/selection based: type in black, switch to red and continue typing in red without recoloring the previous text",
              "Bold, italic and underline also work on the current selection or from the current cursor position",
              "Automatic text block growth expands to the right first and then downward as required",
              "Width and height are persisted continuously and restored from saved note geometry after Text/Pen/Marker/Eraser mode switches",
              "Manual resize uses the dedicated BOOX-safe handle and saves dimensions while dragging",
              "Textblock deletion keeps the LuMa confirmation dialog",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.16 rich text and canonical geometry' || exit 0
          git push
