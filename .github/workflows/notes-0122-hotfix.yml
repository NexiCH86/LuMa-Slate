name: Notes 0.12.34 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.34 header alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01234-header-layout.js').read_text()
          marker='<!-- NOTES-PRO-0.12.34 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.34","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:10:00+02:00","mandatory":false,"releaseNotes":["Restores HANDWRITTEN & DIGITAL at the upper left with Notes directly below it as before","Keeps the three Notes status pills at their current size","Centers TEXT + INK, AUTOSAVE and SYNC READY horizontally within the header area","Aligns the bottom edge of the status pill group with the Notes title","Keeps all confirmed Notes editor and fullscreen behavior unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.34 header alignment' || exit 0
          git push
