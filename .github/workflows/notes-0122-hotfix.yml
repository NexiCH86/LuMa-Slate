name: Notes 0.12.39 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.39 photo-calibrated alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01239-photo-calibrated-align.js').read_text()
          marker='<!-- NOTES-PRO-0.12.39 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.39","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:32:00+02:00","mandatory":false,"releaseNotes":["Moves the three Notes status pills upward based on the supplied BOOX photo so the pill border bottom aligns with the visible bottom of the Notes lettering","Overrides the failed DOM baseline calculations with a stable device-calibrated position","Keeps pill size and horizontal position unchanged","Keeps all confirmed Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.39 photo-calibrated vertical alignment' || exit 0
          git push
