name: Notes 0.12.24 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.24 fullscreen correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01224-fullscreen-correction.js').read_text()
          marker='<!-- NOTES-PRO-0.12.24 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.24","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:01:00+02:00","mandatory":false,"releaseNotes":["Corrects fullscreen after 0.12.23: the old Notes 0.9 header/card plus Speichern and Mit LuMa AI öffnen are hidden because they are siblings of the current Notes root","Restores the fullscreen top-right tool status and X exit control and explicitly protects them from cleanup rules","Keeps the normal redundant status pill hidden","Keeps the hardware-confirmed text, colors, resize, pen, marker, eraser and autosave behavior unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.24 fullscreen correction' || exit 0
          git push
