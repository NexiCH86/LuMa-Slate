name: Notes 0.12.2 hotfix
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Notes Pro 0.12.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- NOTES-PRO-0.12.2 -->'
          if marker not in s:
              js=r'''<!-- NOTES-PRO-0.12.2 -->
<script>
(()=>{'use strict';
const V='0.12.2',KEY='luma.notes.v2',PREF='luma.notes.tools.v3',PROJECTS='luma.projects.v1';
const rd=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let st=rd(KEY,{version:2,notes:[],activeId:null,page:0}),pr=rd(PREF,{tool:'pen',penWidth:3,penStyle:'fountain',penColor:'#111111',markerWidth:22,markerColor:'#FFD400',markerOpacity:5}),fs=false;
const baseProjects=['BOG Fusion','LuMa AI','LuMa Slate','LuMa Air'];
function projects(){let a=rd(PROJECTS,[]);if(!Array.isArray(a))a=[];const names=[...new Set([...baseProjects,...a.map(x=>typeof x==='string'?x:x?.name).filter(Boolean)])];wr(PROJECTS,names.map(name=>({id:'p-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name,updatedAt:Date.now()})));return names}
function active(){return st.notes.find(n=>n.id===st.activeId)||null}function page(){const n=active();return n?.pages?.[Math.max(0,Math.min(st.page,n.pages.length-1))]||null}function save(){st.version=2;wr(KEY,st)}
function css(){if(document.getElementById('np122css'))return;let x=document.createElement('style');x.id='np122css';x.textContent=`#notesPro{display:none!important}.np122{display:grid;grid-template-columns:205px minmax(0,1fr);gap:14px}.np122 aside,.np122 main{background:#fff;border:2px solid #071117;border-radius:13px;padding:12px}.np122 aside{position:sticky;top:90px}.np122-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid #d5ddda}.np122 button,.np122 select,.np122 input{min-height:44px;border:2px solid #071117;border-radius:8px;background:#fff;padding:7px 9px;font-weight:800}.np122 button.sel{background:#071117;color:#fff}.np122-list{display:grid;gap:7px;margin-top:10px;max-height:680px;overflow:auto}.np122-item{text-align:left}.np122-item strong,.np122-item small{display:block}.np122-item.sel{border-width:3px}.np122-meta{display:grid;grid-template-columns:1fr 180px;gap:8px}.np122-title{font-size:18px}.np122-tools,.np122-options,.np122-pages,.np122-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.np122-tools{margin:10px 0 7px}.np122-options{padding:8px;border:2px solid #9aa5a2;border-radius:9px;margin-bottom:8px}.np122-options label{font-size:11px;font-weight:900}.np122-color{width:58px;padding:4px!important;font-size:9px!important}.np122-color i{display:block;height:20px;border:2px solid #071117;border-radius:4px;margin-bottom:2px}.np122-paper{position:relative;width:100%;aspect-ratio:.72;min-height:620px;background:#fff;border:2px solid #071117;overflow:hidden}.np122-ink{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}.np122-textlayer{position:absolute;inset:0;z-index:3;pointer-events:none}.np122-text{position:absolute;min-width:130px;min-height:44px;border:1px dashed #7d8986;background:rgba(255,255,255,.88);padding:5px;font:17px/1.35 Arial;color:#071117;resize:both;overflow:auto;pointer-events:auto}.np122.textmode .np122-ink{pointer-events:auto}.np122:not(.textmode) .np122-text{border-color:transparent;pointer-events:none;background:transparent}.np122-status{font-size:11px;font-weight:900;border:2px solid #07565b;color:#07565b;padding:6px 8px;border-radius:99px}.np122-pages{margin:8px 0}.np122-foot{margin-top:9px}.np122-full .topbar,.np122-full .bottom-nav,.np122-full [data-screen="notes"]>.section-head,.np122-full .np122 aside,.np122-full .np122-meta,.np122-full .np122-tools,.np122-full .np122-options,.np122-full .np122-pages,.np122-full .np122-foot,.np122-full .luma-version-badge{display:none!important}.np122-full .content,.np122-full [data-screen="notes"]{padding:0!important;margin:0!important}.np122-full .np122{display:block}.np122-full .np122 main{padding:0;border:0}.np122-full .np122-paper{height:100vh;min-height:100vh;border:0;aspect-ratio:auto}.np122-fsbar{display:none}.np122-full .np122-fsbar{display:flex;position:fixed;z-index:99;right:10px;top:10px;gap:6px}.np122-full .np122-fsbar button,.np122-full .np122-fsbar span{background:#fff;border:2px solid #071117;border-radius:8px;min-height:44px;padding:8px;font-weight:900}@media(max-width:720px){.np122{grid-template-columns:1fr}.np122 aside{position:static}.np122-list{grid-template-columns:1fr 1fr;max-height:150px}.np122-meta{grid-template-columns:1fr}.np122-paper{min-height:570px}}`;document.head.appendChild(x)}
const colors=[['#111111','Schwarz'],['#0057B8','Blau'],['#C62828','Rot'],['#138A36','Grün'],['#006B70','Petrol'],['#00AFC2','Cyan'],['#6A3DA8','Violett'],['#D06B00','Orange']];const markerColors=[['#FFD400','Gelb'],['#FF8A65','Orange'],['#EF6C9A','Pink'],['#74C69D','Grün'],['#64B5F6','Blau'],['#4DD0E1','Cyan']];
function styleName(){return ({fineliner:'Fineliner',ballpoint:'Kugelschreiber',pencil:'Bleistift',fountain:'Füllfeder',brush:'Brush Pen',felt:'Filzstift'})[pr.penStyle]||'Pen'}function status(){return pr.tool==='marker'?`Marker · ${pr.markerWidth}px`:pr.tool==='eraser'?'Radierer':pr.tool==='text'?'Text + Pen':`${styleName()} · ${pr.penWidth}px`}
function strokeAlpha(style){return style==='pencil'?.58:style==='felt'?.9:style==='brush'?.86:style==='ballpoint'?.92:.98}
function widthFactor(style){return style==='fountain'?1.25:style==='brush'?1.7:style==='felt'?1.45:1}
function render(){document.getElementById('np122')?.remove();const host=document.querySelector('[data-screen="notes"]');if(!host)return;let n=active();if(!n&&st.notes.length){st.activeId=st.notes[0].id;n=active()}const h=document.createElement('section');h.id='np122';h.className='np122 '+(pr.tool==='text'?'textmode':'');host.appendChild(h);if(!n){h.innerHTML=`<aside><div class="np122-head"><strong>Notes Pro ${V}</strong><button id="nNew">＋ Neu</button></div><p>Noch keine Notizen.</p></aside><main></main>`;document.getElementById('nNew').onclick=newNote;return}n.pages=n.pages?.length?n.pages:[{id:'p1',text:'',strokes:[],texts:[]}];st.page=Math.max(0,Math.min(st.page,n.pages.length-1));let pg=page();pg.strokes=pg.strokes||[];pg.texts=pg.texts||[];if(pg.text&&!pg.texts.length){pg.texts.push({id:'t-migrated',x:.05,y:.05,w:.9,text:pg.text});pg.text='';save()}const ps=projects();h.innerHTML=`<aside><div class="np122-head"><div><strong>Notes Pro</strong><small style="display:block">${st.notes.length} Notizen</small></div><button id="nNew">＋ Neu</button></div><div class="np122-list">${st.notes.map(x=>`<button class="np122-item ${x.id===n.id?'sel':''}" data-nid="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(x.date)} · ${x.pages?.length||1} S.</small></button>`).join('')}</div></aside><main><div class="np122-meta"><input id="nTitle" class="np122-title" value="${esc(n.title)}"><select id="nProject"><option value="">Kein Projekt</option>${ps.map(x=>`<option ${n.project===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new__">＋ Neues Projekt…</option></select></div><div class="np122-tools"><button data-tool="text">⌨ Text</button><button data-tool="pen">✎ Pen</button><button data-tool="marker">▰ Marker</button><button data-tool="eraser">⌫ Radierer</button><span class="np122-status">${status()}</span><button id="nUndo">↶ Undo</button><button id="nFull">⛶ Vollbild</button></div><div class="np122-options"><label>Pen-Art</label><select id="nStyle">${[['fineliner','Fineliner'],['ballpoint','Kugelschreiber'],['pencil','Bleistift'],['fountain','Füllfeder'],['brush','Brush Pen'],['felt','Filzstift']].map(([v,t])=>`<option value="${v}" ${pr.penStyle===v?'selected':''}>${t}</option>`).join('')}</select><label>Dicke</label>${[1,2,3,5,8].map(v=>`<button data-pw="${v}" class="${pr.penWidth===v?'sel':''}">${v}</button>`).join('')}<label>Pen-Farbe</label>${colors.map(([c,t])=>`<button class="np122-color ${pr.penColor===c?'sel':''}" data-pc="${c}"><i style="background:${c}"></i>${t}</button>`).join('')}<label>Marker-Farbe</label>${markerColors.map(([c,t])=>`<button class="np122-color ${pr.markerColor===c?'sel':''}" data-mc="${c}"><i style="background:${c}"></i>${t}</button>`).join('')}<select id="nMW">${[12,18,22,28,36].map(v=>`<option value="${v}" ${pr.markerWidth===v?'selected':''}>Marker ${v}px</option>`).join('')}</select><select id="nMO">${[2,3,4,5,6,7,8].map(v=>`<option value="${v}" ${pr.markerOpacity===v?'selected':''}>Deckkraft ${v}/10</option>`).join('')}</select></div><div class="np122-pages"><button id="nPrev">‹</button>${n.pages.map((_,i)=>`<button data-pg="${i}" class="${i===st.page?'sel':''}">${i+1}</button>`).join('')}<button id="nNext">›</button><button id="nAdd">＋ Seite</button></div><div class="np122-paper" id="nPaper"><canvas class="np122-ink" id="nInk"></canvas><div class="np122-textlayer" id="nTexts">${pg.texts.map(t=>`<textarea class="np122-text" data-tid="${t.id}" style="left:${t.x*100}%;top:${t.y*100}%;width:${(t.w||.45)*100}%">${esc(t.text)}</textarea>`).join('')}</div></div><div class="np122-foot"><button id="nAI">◉ An LuMa AI</button><button id="nClear">Ink löschen</button><button id="nDel">Notiz löschen</button></div></main><div class="np122-fsbar"><span>${status()}</span><button id="nFsExit">✕</button></div>`;bind(n,pg);setTimeout(ink,20)}
function newNote(){let id='n-'+Date.now();st.notes.unshift({id,title:'Neue Notiz',date:new Date().toLocaleDateString('de-CH'),updatedAt:Date.now(),project:'',pages:[{id:'p-'+Date.now(),text:'',texts:[],strokes:[]}]});st.activeId=id;st.page=0;save();render()}
function bind(n,pg){document.getElementById('nNew').onclick=newNote;document.querySelectorAll('[data-nid]').forEach(b=>b.onclick=()=>{st.activeId=b.dataset.nid;st.page=0;save();render()});document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{st.page=+b.dataset.pg;save();render()});document.querySelectorAll('[data-tool]').forEach(b=>{b.classList.toggle('sel',b.dataset.tool===pr.tool);b.onclick=()=>{pr.tool=b.dataset.tool;wr(PREF,pr);render()}});document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>{pr.penWidth=+b.dataset.pw;wr(PREF,pr);render()});document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{pr.penColor=b.dataset.pc;wr(PREF,pr);render()});document.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{pr.markerColor=b.dataset.mc;wr(PREF,pr);render()});document.getElementById('nStyle').onchange=e=>{pr.penStyle=e.target.value;wr(PREF,pr);render()};document.getElementById('nMW').onchange=e=>{pr.markerWidth=+e.target.value;wr(PREF,pr);render()};document.getElementById('nMO').onchange=e=>{pr.markerOpacity=+e.target.value;wr(PREF,pr);render()};document.getElementById('nTitle').oninput=e=>{n.title=e.target.value||'Notiz';n.updatedAt=Date.now();save()};document.getElementById('nProject').onchange=e=>{if(e.target.value==='__new__'){let name=prompt('Name des neuen Projekts:','');if(name?.trim()){name=name.trim();let a=rd(PROJECTS,[]);a.push({id:'p-'+Date.now(),name,createdAt:Date.now(),updatedAt:Date.now()});wr(PROJECTS,a);n.project=name;save()}render()}else{n.project=e.target.value;save()}};document.getElementById('nPrev').onclick=()=>{st.page=Math.max(0,st.page-1);save();render()};document.getElementById('nNext').onclick=()=>{st.page=Math.min(n.pages.length-1,st.page+1);save();render()};document.getElementById('nAdd').onclick=()=>{n.pages.push({id:'p-'+Date.now(),text:'',texts:[],strokes:[]});st.page=n.pages.length-1;save();render()};document.getElementById('nUndo').onclick=()=>{pg.strokes.pop();save();draw()};document.getElementById('nClear').onclick=()=>{pg.strokes=[];save();draw()};document.getElementById('nDel').onclick=()=>{st.notes=st.notes.filter(x=>x!==n);st.activeId=st.notes[0]?.id||null;st.page=0;save();render()};document.getElementById('nFull').onclick=()=>{fs=true;document.body.classList.add('np122-full');render()};document.getElementById('nFsExit').onclick=()=>{fs=false;document.body.classList.remove('np122-full');render()};document.getElementById('nAI').onclick=()=>{localStorage.setItem('luma.ai.note.context',JSON.stringify({id:n.id,title:n.title,project:n.project,page:st.page+1,texts:pg.texts}));document.querySelector('[data-go="ai"]')?.click()};document.querySelectorAll('.np122-text').forEach(t=>t.oninput=e=>{let z=pg.texts.find(x=>x.id===e.target.dataset.tid);if(z){z.text=e.target.value;n.updatedAt=Date.now();save()}})}
function rgba(hex,a){let n=parseInt(String(hex).replace('#',''),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function draw(extra){let c=document.getElementById('nInk'),pg=page();if(!c||!pg)return;let r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}let x=c.getContext('2d');x.clearRect(0,0,w,h);for(let s of [...pg.strokes,...(extra?[extra]:[])]){if(!s.points?.length)continue;x.beginPath();x.lineCap=x.lineJoin='round';x.strokeStyle=rgba(s.color||'#111111',s.opacity??.95);x.lineWidth=Math.max(1,(s.width||3)*w/1000*widthFactor(s.style));s.points.forEach((q,i)=>i?x.lineTo(q[0]*w,q[1]*h):x.moveTo(q[0]*w,q[1]*h));x.stroke()}}
function erase(x,y){let pg=page(),bi=-1,bd=.035;pg.strokes.forEach((s,i)=>(s.points||[]).forEach(q=>{let d=Math.hypot(q[0]-x,q[1]-y);if(d<bd){bd=d;bi=i}}));if(bi>=0){pg.strokes.splice(bi,1);save();draw()}}
function ink(){let c=document.getElementById('nInk'),paper=document.getElementById('nPaper');if(!c)return;let down=false,s=null,er=false;const pt=e=>{let r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};c.onpointerdown=e=>{let [x,y]=pt(e),back=e.pointerType==='pen'&&(e.button===5||(e.buttons&32)===32),tool=back?'eraser':pr.tool;if(tool==='text'){let hit=document.elementFromPoint(e.clientX,e.clientY);if(hit?.classList?.contains('np122-text'))return;let pg=page(),id='t-'+Date.now();pg.texts.push({id,x:Math.max(0,Math.min(.82,x)),y:Math.max(0,Math.min(.92,y)),w:.42,text:''});save();render();setTimeout(()=>{let t=document.querySelector(`[data-tid="${id}"]`);t?.focus();t?.click()},30);e.preventDefault();return}if(tool==='eraser'){er=true;erase(x,y);e.preventDefault();return}down=true;c.setPointerCapture?.(e.pointerId);s={tool,style:tool==='marker'?'marker':pr.penStyle,width:tool==='marker'?pr.markerWidth:pr.penWidth,color:tool==='marker'?pr.markerColor:pr.penColor,opacity:tool==='marker'?pr.markerOpacity/10:strokeAlpha(pr.penStyle),points:[[x,y]]};e.preventDefault()};c.onpointermove=e=>{let[x,y]=pt(e);if(er||(e.pointerType==='pen'&&(e.buttons&32)===32)){erase(x,y);e.preventDefault();return}if(!down||!s)return;s.points.push([x,y]);draw(s);e.preventDefault()};c.onpointerup=e=>{er=false;if(down&&s){page().strokes.push(s);active().updatedAt=Date.now();save();draw()}down=false;s=null;e.preventDefault()};draw()}
function boot(){css();if(!st?.notes)st={version:2,notes:[],activeId:null,page:0};render();window.addEventListener('resize',()=>setTimeout(draw,80));console.info('Notes Pro '+V+' ready')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>'''
              s=s.replace('</body>',js+'\n</body>')
              p.write_text(s)
          m=Path('update-manifest.json')
          m.write_text('''{\n  "product": "LuMa Slate",\n  "channel": "stable",\n  "latestUiVersion": "0.12.2",\n  "minimumShellVersion": "1.1.0",\n  "publishedAt": "2026-08-30T10:52:00+02:00",\n  "mandatory": false,\n  "releaseNotes": [\n    "Notes Pro 0.12.2 combines typed text blocks and handwriting on the same page",\n    "Text mode now lets you tap a position on the paper and type there without hiding ink",\n    "Added Fineliner, ballpoint, pencil, fountain pen, brush pen and felt-tip pen styles",\n    "Expanded high-contrast Kaleido pen colors and added independent marker colors",\n    "Added Notes fullscreen writing mode with compact active-tool indicator",\n    "Projects can now be created directly from Notes and are stored in the shared LuMa project registry",\n    "Existing Notes v2 data is retained; no new APK is required"\n  ]\n}\n''')
          PY
      - name: Commit update
        run: |
          git config user.name "LuMa Slate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html update-manifest.json
          git commit -m "feat(notes): publish Notes Pro 0.12.2" || exit 0
          git push
