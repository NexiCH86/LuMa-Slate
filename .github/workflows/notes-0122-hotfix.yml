name: Notes 0.12.20 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.20 fullscreen cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          j=Path('notes-01220-fullscreen-cleanup.js').read_text()
          marker='<!-- NOTES-PRO-0.12.20 -->'
          if marker not in s:
              s=s.replace('</body>', marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.20",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T13:04:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Keeps the hardware-confirmed Notes 0.12.19 editor, mixed colors, resize and geometry behavior unchanged",
              "Removes the redundant manual Speichern button because Notes already persist continuously through Autosave",
              "Fullscreen is now a distraction-free paper workspace: Notes Pro header/card, Speichern, Mit LuMa AI öffnen, sidebar, page/tool controls and text option bars are hidden",
              "The compact top-right fullscreen HUD remains and shows only the currently selected tool plus the X exit control",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.20 clean fullscreen workspace' || exit 0
          git push
