name: Notes 0.12.27 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.27 HUD cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01227-hud-cleanup.js').read_text()
          marker='<!-- NOTES-PRO-0.12.27 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.27","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:10:00+02:00","mandatory":false,"releaseNotes":["Removes the redundant Notes label from the dedicated fullscreen HUD so it no longer covers the existing Pen/Marker tool information","Keeps only the dedicated X exit control from the fallback HUD while the original fullscreen tool info remains visible","Preserves the 0.12.26 stay-in-Notes-after-delete behavior and all hardware-confirmed editor features","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.27 fullscreen HUD cleanup' || exit 0
          git push
