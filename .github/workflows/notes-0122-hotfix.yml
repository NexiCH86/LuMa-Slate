name: LuMa Slate 0.12.44 branding publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish LuMa Slate product branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('branding-01244-luma-slate.js').read_text()
          marker='<!-- LUMA-SLATE-BRANDING-0.12.44 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.44","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T17:02:00+02:00","mandatory":false,"releaseNotes":["Replaces the in-app header mark with the definitive LuMa Slate product icon from the LuMa Labs app-icon master set","Preserves the approved Notes layout and 0.12.43 pill position unchanged","Shell 1.1.1 adds the matching LuMa Slate Android launcher icon","Existing users can receive the in-app logo through OTA; the Android home-screen icon requires installation of Shell 1.1.1"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(branding): publish LuMa Slate product logo 0.12.44' || exit 0
          git push
