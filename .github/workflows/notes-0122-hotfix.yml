name: Notes 0.12.26 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.26 delete stay fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01226-delete-stay.js').read_text()
          marker='<!-- NOTES-PRO-0.12.26 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.26","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:07:00+02:00","mandatory":false,"releaseNotes":["Keeps the user inside the Notes screen after deleting an individual note instead of returning to Home","The remaining note becomes the active Notes workspace; if no note remains, the empty Notes state stays visible","No changes to the hardware-confirmed editor, fullscreen HUD, colors, resize, pen, marker, eraser or autosave","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.26 stay in Notes after delete' || exit 0
          git push
