name: Notes 0.12.13 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.13 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01213-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.13 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.13",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:18:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "All visible text block dimensions are saved before every tool switch, so older handlers cannot lose the active block geometry",
              "Saved text block width and height are enforced through canonical CSS variables with important rules across Text, Pen, Marker and Eraser modes",
              "Text controls now render as a sibling directly below the standard options row, avoiding legacy popup click handlers while keeping the same visual position as Pen and Marker options",
              "Legacy floating text option panels and the previous inline bar remain hidden",
              "Automatic cleanup of empty text blocks remains enabled",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.13 canonical geometry and stable toolbar' || exit 0
          git push
