name: Notes 0.12.23 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.23 UI fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01223-ui-fix.js').read_text()
          marker='<!-- NOTES-PRO-0.12.23 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.23","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T14:58:00+02:00","mandatory":false,"releaseNotes":["Fixes the remaining Text + Pen rounded status pill by targeting the actual np122-status element","Fixes fullscreen cleanup against the real implementation, which uses the body class np122-full rather than the browser Fullscreen API","In fullscreen, topbar, bottom navigation, Notes title/header, sidebar, metadata, toolbars, options, page controls and footer actions are hidden while the paper fills the viewport","Keeps the existing fullscreen top-right status/X bar from the base Notes implementation","No changes to the hardware-confirmed writing, colors, resize or autosave logic","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.23 real fullscreen cleanup' || exit 0
          git push
