name: Notes 0.12.29 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken 0.12.28 delete interception and inline 0.12.29
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<!-- NOTES-PRO-0\.12\.28 --><script>.*?</script>','',s,flags=re.S)
          j=Path('notes-01229-delete-modal-fix.js').read_text(); marker='<!-- NOTES-PRO-0.12.29 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.29","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:30:00+02:00","mandatory":false,"releaseNotes":["Removes the broken 0.12.28 delete interception that blocked both confirmation and deletion","Restores a LuMa confirmation dialog for deleting a note","After confirmation the original Notes delete handler performs the actual deletion/render, while Notes is forced to remain the active screen","Keeps the Pen/Marker option isolation from 0.12.28 without changing the hardware-confirmed fullscreen mode","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.29 delete confirmation repair' || exit 0
          git push
