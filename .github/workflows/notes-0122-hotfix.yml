name: Notes 0.12.7 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Notes state synchronization and update manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function render(){document.getElementById('np122')?.remove();"
          new="function render(){st=rd(KEY,st);document.getElementById('np122')?.remove();"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Notes core render hook not found')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.7",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T11:44:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Fixes Notes state synchronization between Text, Pen and Marker modes",
              "Typed text blocks now remain stored and visible after switching tools",
              "Confirmed Ink deletion now remains deleted after switching tools",
              "Notes core reloads the latest persisted note state before every render instead of restoring stale in-memory data",
              "Existing text formatting, positioned text blocks, Pen/Marker layering and deletion confirmations are retained",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.7 state sync' || exit 0
          git push
