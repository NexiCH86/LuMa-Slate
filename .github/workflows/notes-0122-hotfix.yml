name: Notes 0.12.36 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.36 raised status pills
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01236-header-raise.js').read_text()
          marker='<!-- NOTES-PRO-0.12.36 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.36","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:18:00+02:00","mandatory":false,"releaseNotes":["Moves the three Notes status pills upward while preserving their confirmed horizontal position and size","Leaves HANDWRITTEN & DIGITAL and Notes unchanged","Keeps all confirmed Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.36 raise status pills' || exit 0
          git push
