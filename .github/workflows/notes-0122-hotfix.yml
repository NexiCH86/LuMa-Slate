name: Notes 0.12.21 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.21 toolbar cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          j=Path('notes-01221-toolbar-cleanup.js').read_text()
          marker='<!-- NOTES-PRO-0.12.21 -->'
          if marker not in s:
              s=s.replace('</body>', marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.21",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T13:10:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Keeps the hardware-confirmed Notes editor, mixed colors, resize, autosave and fullscreen behavior unchanged",
              "Removes the redundant rounded tool-summary pill such as Füllfeder · 8px or Marker · 22px from the normal Notes toolbar",
              "Pen and marker type/width remain visible and adjustable in the contextual options below, so no functionality is lost",
              "The compact fullscreen top-right tool indicator and X exit control remain unchanged",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.21 toolbar cleanup' || exit 0
          git push
