name: Notes 0.12.12 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.12 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01212-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.12 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.12",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:12:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Text block width and height are now persisted before every tool switch and restored exactly after the Notes view is rebuilt",
              "Pen, Marker and Eraser modes keep the same saved text block geometry instead of reverting to the default block size",
              "Text options are now integrated into the same contextual options area used by Pen and Marker",
              "The floating Aa Textoptionen button and floating panel are retired from the active UI",
              "Text mode shows font, size, bold, italic, underline and delete controls directly below the tool selector",
              "Automatic cleanup of empty text blocks remains enabled",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.12 persistent geometry and inline options' || exit 0
          git push
