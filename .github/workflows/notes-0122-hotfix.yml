name: Notes 0.12.28 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.28 mode/delete fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01228-mode-delete-fix.js').read_text()
          marker='<!-- NOTES-PRO-0.12.28 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.28","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T15:24:00+02:00","mandatory":false,"releaseNotes":["Keeps Notes active after deleting an individual note by intercepting the delete action before the legacy handler can navigate away","Separates Pen and Marker option groups so changing a Pen setting cannot reveal Marker controls and changing a Marker setting cannot reveal Pen controls","Text uses only the stable text-format toolbar; eraser has no redundant option row","Preserves the hardware-confirmed fullscreen mode from 0.12.27 and all editor/autosave behavior","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.28 mode and delete fixes' || exit 0
          git push
