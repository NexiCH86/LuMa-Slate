name: Notes 0.12.4 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.4 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-0124-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.4 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.4",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T11:18:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Pen and marker ink now renders above positioned text blocks so handwritten notes and highlights can cross typed text",
              "Text blocks become editable only in Text mode while remaining transparent in Pen and Marker modes",
              "Ink löschen now requires an explicit confirmation before clearing handwriting and marker strokes",
              "Notiz löschen now requires an explicit confirmation before deleting the complete note and all pages",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'feat(notes): publish Notes Pro 0.12.4' || exit 0
          git push
