name: Notes 0.12.17 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate Notes patches and publish 0.12.17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove all stacked Notes hotfix scripts from 0.12.8 through 0.12.16.
          # Their anonymous listeners were the source of duplicate handles and competing editors.
          for v in range(8,17):
              marker=f'<!-- NOTES-PRO-0.12.{v} -->'
              s=re.sub(re.escape(marker)+r'<script>.*?</script>', '', s, flags=re.S)
          # Defensive cleanup if an earlier marker was followed by whitespace.
          s=re.sub(r'<!-- NOTES-PRO-0\.12\.(?:8|9|10|11|12|13|14|15|16) -->\s*<script>.*?</script>', '', s, flags=re.S)
          j=Path('notes-01217-patch.js').read_text()
          marker='<!-- NOTES-PRO-0.12.17 -->'
          if marker not in s:
              s=s.replace('</body>', marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.17",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:52:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Emergency stabilization after 0.12.16: normal BOOX text input and caret interaction are restored",
              "All stacked Notes hotfix scripts 0.12.8 through 0.12.16 are removed from the delivered index so their old listeners can no longer compete",
              "Exactly one large 52px BOOX-safe resize handle remains; legacy and rich-text handles are suppressed",
              "The rich-text overlay introduced in 0.12.16 is removed because it blocked writing on the real BOOX device",
              "Text block width and height are saved on input, resize, blur and before tool switches, then restored from canonical note geometry",
              "Automatic growth expands to the right while space remains and then downward when wrapping is needed",
              "The stable text options row and delete confirmation remain available",
              "Per-character mixed text colors are temporarily deferred until the core editor is hardware-stable; this release prioritizes reliable writing and geometry",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.17 consolidated editor cleanup' || exit 0
          git push
