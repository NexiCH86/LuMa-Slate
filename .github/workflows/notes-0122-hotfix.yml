name: Notes 0.12.37 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.37 pixel alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); j=Path('notes-01237-pixel-align.js').read_text()
          marker='<!-- NOTES-PRO-0.12.37 -->'
          if marker not in s: s=s.replace('</body>',marker+'<script>'+j+'</script></body>')
          p.write_text(s)
          PY
          cat > update-manifest.json <<'EOF'
          {"product":"LuMa Slate","channel":"stable","latestUiVersion":"0.12.37","minimumShellVersion":"1.1.0","publishedAt":"2026-08-30T16:22:00+02:00","mandatory":false,"releaseNotes":["Pixel-aligns the bottom edge of the three Notes status pills to the rendered bottom edge of the Notes title","Measures the actual BOOX-rendered elements instead of using a fixed vertical offset","Keeps horizontal position and pill size unchanged","Keeps all confirmed Notes functionality unchanged","No APK required"]}
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish 0.12.37 pixel-align status pills' || exit 0
          git push
