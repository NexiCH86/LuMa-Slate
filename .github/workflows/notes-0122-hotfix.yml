name: Notes 0.12.14 publisher
on:
  push:
    paths:
      - '.github/workflows/notes-0122-hotfix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Notes 0.12.14 patch and update manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); j=Path('notes-01214-patch.js').read_text(); marker='<!-- NOTES-PRO-0.12.14 -->'; s=s if marker in s else s.replace('</body>', marker+'<script>'+j+'</script></body>'); p.write_text(s)"
          cat > update-manifest.json <<'EOF'
          {
            "product": "LuMa Slate",
            "channel": "stable",
            "latestUiVersion": "0.12.14",
            "minimumShellVersion": "1.1.0",
            "publishedAt": "2026-08-30T12:24:00+02:00",
            "mandatory": false,
            "releaseNotes": [
              "Textblock löschen now opens a LuMa confirmation dialog with Abbrechen and Löschen before any text is removed",
              "A dedicated BOOX-safe resize handle restores manual text block resizing without relying on the browser-native resize implementation",
              "Text blocks once again grow automatically to the right while space is available and then downward as text wraps",
              "Manual and automatic width/height changes are persisted immediately and remain canonical across tool switches",
              "The stable text options row from 0.12.13 remains unchanged in its current position",
              "Empty text block cleanup remains enabled",
              "No new APK is required; Shell 1.1.0 remains sufficient"
            ]
          }
          EOF
      - name: Commit stable release
        run: |
          git config user.name 'LuMa Slate Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html update-manifest.json
          git commit -m 'fix(notes): publish Notes Pro 0.12.14 resize auto-growth and delete confirmation' || exit 0
          git push
